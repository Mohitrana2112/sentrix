<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGradIcon" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#00D5FF"/>
      <stop offset="50%" stop-color="#2878FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .icon-shield-bg { fill: #142238; fill-opacity: 0.95; }
      @media (prefers-color-scheme: light) {
        .icon-shield-bg { fill: #EDF6FF; fill-opacity: 0.95; }
      }
    </style>
  </defs>

  <!-- Outer Shield Geometric Border -->
  <path d="M50 8 L85 24 L85 52 C85 72 68 88 50 94 C32 88 15 72 15 52 L15 24 Z" 
        class="icon-shield-bg" 
        stroke="url(#shieldGradIcon)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
        filter="url(#iconGlow)" />

  <!-- Circuit Pattern Lines -->
  <path d="M28 36 L40 36 L48 44" stroke="#00D5FF" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1 2"/>
  <circle cx="28" cy="36" r="2" fill="#00D5FF"/>
  <circle cx="48" cy="44" r="1.5" fill="#00D5FF"/>

  <path d="M72 36 L60 36 L52 44" stroke="#00D5FF" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1 2"/>
  <circle cx="72" cy="36" r="2" fill="#00D5FF"/>
  <circle cx="52" cy="44" r="1.5" fill="#00D5FF"/>

  <path d="M50 78 L50 86" stroke="#2878FF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="78" r="2" fill="#2878FF"/>

  <!-- Futuristic Geometric 'S' -->
  <path d="M62 38 C60 32 40 30 38 42 C36 50 64 50 62 60 C60 70 38 70 36 62" 
        stroke="url(#shieldGradIcon)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Magnifying Target Reticle Center -->
  <circle cx="50" cy="50" r="14" stroke="#00D5FF" stroke-width="2" stroke-dasharray="6 3" fill="none"/>
  <circle cx="50" cy="50" r="4" fill="#00D5FF"/>
  
  <!-- Reticle Crosshairs -->
  <line x1="50" y1="32" x2="50" y2="36" stroke="#00D5FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="64" x2="50" y2="68" stroke="#00D5FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="36" y2="50" stroke="#00D5FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="50" x2="68" y2="50" stroke="#00D5FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Scanning Angular Glint -->
  <polygon points="50,15 54,23 50,21 46,23" fill="#00D5FF"/>
</svg>