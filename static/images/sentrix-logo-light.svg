<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" fill="none">
  <defs>
    <linearGradient id="shieldGradLight" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shieldBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2D42"/>
    </linearGradient>
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Left Icon Shield -->
  <g transform="translate(10, 5) scale(0.7)">
    <!-- Outer Shield Border -->
    <path d="M50 8 L85 24 L85 52 C85 72 68 88 50 94 C32 88 15 72 15 52 L15 24 Z" 
          fill="url(#shieldBgLight)" 
          stroke="url(#shieldGradLight)" 
          stroke-width="3.5" 
          stroke-linejoin="round"
          filter="url(#shadowLight)" />

    <!-- Circuit Pattern Lines -->
    <path d="M28 36 L40 36 L48 44" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1 2"/>
    <circle cx="28" cy="36" r="2" fill="#0284C7"/>
    <circle cx="48" cy="44" r="1.5" fill="#0284C7"/>

    <path d="M72 36 L60 36 L52 44" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1 2"/>
    <circle cx="72" cy="36" r="2" fill="#0284C7"/>
    <circle cx="52" cy="44" r="1.5" fill="#0284C7"/>

    <path d="M50 78 L50 86" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="78" r="2" fill="#2563EB"/>

    <!-- Geometric S -->
    <path d="M62 38 C60 32 40 30 38 42 C36 50 64 50 62 60 C60 70 38 70 36 62" 
          stroke="url(#shieldGradLight)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Reticle Center -->
    <circle cx="50" cy="50" r="14" stroke="#0284C7" stroke-width="2" stroke-dasharray="6 3" fill="none"/>
    <circle cx="50" cy="50" r="4" fill="#0284C7"/>
    <line x1="50" y1="32" x2="50" y2="36" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="64" x2="50" y2="68" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="50" x2="36" y2="50" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
    <line x1="64" y1="50" x2="68" y2="50" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(86, 0)">
    <!-- Primary Brand Wordmark: SENTRIX -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="5" 
          fill="url(#textGradLight)">
      SENTR<tspan fill="#0284C7">I</tspan><tspan fill="#2563EB">X</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="62" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="9" 
          font-weight="700" 
          letter-spacing="2.2" 
          fill="#334155">
      SECURITY ANALYSIS &amp; URL INTELLIGENCE
    </text>

    <!-- Accent Circuit Line under Wordmark -->
    <path d="M190 28 L275 28 L283 36" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.8" stroke-dasharray="2 3"/>
    <circle cx="283" cy="36" r="1.5" fill="#0284C7"/>
  </g>
</svg>