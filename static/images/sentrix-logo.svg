<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#00D5FF"/>
      <stop offset="50%" stop-color="#2878FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .sentrix-shield-bg { fill: #142238; }
      .sentrix-text-main { fill: #F8FAFC; }
      .sentrix-text-sub { fill: #94A3B8; }
      @media (prefers-color-scheme: light) {
        .sentrix-shield-bg { fill: #EDF6FF; }
        .sentrix-text-main { fill: #0B132B; }
        .sentrix-text-sub { fill: #334155; }
      }
    </style>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(10, 5) scale(0.7)">
    <path d="M50 8 L85 24 L85 52 C85 72 68 88 50 94 C32 88 15 72 15 52 L15 24 Z" 
          class="sentrix-shield-bg" 
          stroke="url(#shieldGrad)" 
          stroke-width="3.5" 
          stroke-linejoin="round"
          filter="url(#logoGlow)" />

    <!-- Circuit Pattern Lines -->
    <path d="M28 36 L40 36 L48 44" stroke="#00D5FF" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1 2"/>
    <circle cx="28" cy="36" r="2" fill="#00D5FF"/>
    <circle cx="48" cy="44" r="1.5" fill="#00D5FF"/>

    <path d="M72 36 L60 36 L52 44" stroke="#00D5FF" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1 2"/>
    <circle cx="72" cy="36" r="2" fill="#00D5FF"/>
    <circle cx="52" cy="44" r="1.5" fill="#00D5FF"/>

    <path d="M50 78 L50 86" stroke="#2878FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="78" r="2" fill="#2878FF"/>

    <!-- Geometric S -->
    <path d="M62 38 C60 32 40 30 38 42 C36 50 64 50 62 60 C60 70 38 70 36 62" 
          stroke="url(#shieldGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Reticle Center -->
    <circle cx="50" cy="50" r="14" stroke="#00D5FF" stroke-width="2" stroke-dasharray="6 3" fill="none"/>
    <circle cx="50" cy="50" r="4" fill="#00D5FF"/>
    <line x1="50" y1="32" x2="50" y2="36" stroke="#00D5FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="64" x2="50" y2="68" stroke="#00D5FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="50" x2="36" y2="50" stroke="#00D5FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="64" y1="50" x2="68" y2="50" stroke="#00D5FF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(86, 0)">
    <!-- Wordmark -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="5" 
          class="sentrix-text-main">
      SENTR<tspan fill="#00D5FF">I</tspan><tspan fill="#2878FF">X</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="62" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="9" 
          font-weight="700" 
          letter-spacing="2.2" 
          class="sentrix-text-sub">
      SECURITY ANALYSIS &amp; URL INTELLIGENCE
    </text>

    <!-- Accent Line -->
    <path d="M190 28 L275 28 L283 36" stroke="#00D5FF" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2 3"/>
    <circle cx="283" cy="36" r="1.5" fill="#00D5FF"/>
  </g>
</svg>